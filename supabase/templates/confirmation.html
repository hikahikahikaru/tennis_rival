<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>メールアドレスの確認</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f6f5; color: #26332d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f6f5;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 600px; background-color: #ffffff; border: 1px solid #dfe6e2; border-radius: 8px;">
            <tr>
              <td style="padding: 32px 24px;">
                <h1 style="margin: 0 0 24px; color: #176b45; font-size: 24px; line-height: 1.4;">
                  Tennis Rivalへようこそ
                </h1>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.8;">
                  アカウントをご登録いただき、ありがとうございます。
                </p>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.8;">
                  登録を完了するため、以下のボタンからメールアドレスを確認してください。
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto 24px;">
                  <tr>
                    <td align="center" style="border-radius: 6px; background-color: #176b45;">
                      <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 14px 24px; color: #ffffff; font-size: 16px; font-weight: 700; line-height: 1.2; text-decoration: none;">
                        メールアドレスを確認する
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 0 0 8px; font-size: 13px; line-height: 1.7; color: #5f6d66;">
                  ボタンを押せない場合は、以下のURLをブラウザに貼り付けてください。
                </p>
                <p style="margin: 0 0 24px; overflow-wrap: anywhere; font-size: 13px; line-height: 1.7;">
                  <a href="{{ .ConfirmationURL }}" style="color: #176b45;">{{ .ConfirmationURL }}</a>
                </p>
                <p style="margin: 0; padding-top: 20px; border-top: 1px solid #dfe6e2; font-size: 13px; line-height: 1.7; color: #5f6d66;">
                  このメールに心当たりがない場合は、リンクを開かずにこのメールを破棄してください。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
